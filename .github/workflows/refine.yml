# Refine an issue on GitHub's machines, through a conversation in comments (ADR 0010). Put the label 'refine'
# on an issue, and Anthropic's Claude Code action runs /refine on a branch of its own: it drafts the change
# from the issue, with its assumptions and numbered questions, and this workflow opens the spec pull request.
# The author answers on that pull request in a comment that mentions @claude, and each such comment is
# another run, which revises the change on the same branch. A developer reviews the same pull request;
# merging it is the approval.
#
# Each run reads the issue or pull request and its comments afresh: the thread is the conversation's
# memory. The action answers only people with write access to the repository, as it does by default.
#
# Needs what the deliver workflow needs: the Claude GitHub app, whose token pushes the branch and opens the
# pull request (so the build runs on it), and the secret ANTHROPIC_API_KEY. Each run is capped at $1.00,
# on the model in scripts/delivery-model.txt.
name: refine

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: write

env:
  OPENSPEC_TELEMETRY: '0'

concurrency:
  group: refine-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  refine:
    # The label on an issue starts a refinement. A comment mentioning @claude carries one on, but only on a
    # pull request whose branch is a refinement's; which branch that is, a comment event does not say, so
    # the first step finds out. Comments by bots, the action's own among them, start nothing.
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'refine') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.user.type != 'Bot' &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && github.event.comment.user.type != 'Bot' &&
        contains(github.event.comment.body, '@claude') &&
        startsWith(github.event.pull_request.head.ref, 'refine/'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Find what is being refined
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [[ "$EVENT" == issues ]]; then
            { echo "issue=$NUMBER"
              echo "stage=This is the first run: draft the change, with your assumptions and numbered questions."
              echo "go=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="$(gh pr view "$NUMBER" --repo "$REPO" --json headRefName --jq .headRefName)"
          if [[ "$branch" =~ ^refine/(issue-)?([0-9]+)- ]]; then
            { echo "issue=${BASH_REMATCH[2]}"
              echo "pr=$NUMBER"
              echo "stage=This is a later run, on spec pull request #$NUMBER: the comments since the change was last revised are the author's answers and the reviewer's points."
              echo "go=true"
            } >> "$GITHUB_OUTPUT"
          else
            echo "Pull request #$NUMBER is not a refinement (its branch is $branch); nothing to do."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.find.outputs.go == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: steps.find.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # OpenSpec from the project's pinned copy, on the PATH so its skills can run it.
      - if: steps.find.outputs.go == 'true'
        run: |
          npm ci --ignore-scripts
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Read the tools and the model
        if: steps.find.outputs.go == 'true'
        id: setup
        run: |
          echo "tools=$(paste -sd, scripts/refine-tools.txt)" >> "$GITHUB_OUTPUT"
          model="$(tr -d '[:space:]' < scripts/delivery-model.txt)"
          [[ "$model" =~ ^[a-z0-9][a-z0-9.-]*$ ]] || { echo "Not a model name: '${model}'." >&2; exit 1; }
          echo "model=$model" >> "$GITHUB_OUTPUT"

      # v1, pinned to the same commit as the deliver workflow. On the issue, the action makes a refine/
      # branch; on the spec pull request, it works on that pull request's branch, and can push only there.
      - if: steps.find.outputs.go == 'true'
        id: claude
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: refine
          track_progress: true
          branch_prefix: refine/
          prompt: |
            Run this project's /refine command (.claude/commands/refine.md) for issue #${{ steps.find.outputs.issue }}.
            You are on GitHub: the author is not here, and the issue, the pull request and their comments are
            everything they have said. You are on the refinement's branch already. ${{ steps.find.outputs.stage }}
            Commit the change folder and push with the git tools you were given, write the pull request
            description to .refine/pull-request.md, and put the plain-terms read-back and the open questions in
            your comment.
          claude_args: >-
            --model ${{ steps.setup.outputs.model }}
            --max-budget-usd 1.00
            --max-turns 40
            --allowedTools "${{ steps.setup.outputs.tools }}"

      # The action pushes a branch and stops; it does not open pull requests. A refinement's conversation
      # happens on its spec pull request, so the first run opens it. The action has revoked its own token by
      # now, so this uses the workflow's; a pull request opened with that starts no workflows, so the build
      # is started on the branch explicitly, and its check lands on the pull request's commit. A later run
      # updates the description; its push, with the action's token, runs the build as usual.
      - name: Open or update the spec pull request
        if: steps.find.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.find.outputs.issue }}
          PR: ${{ steps.find.outputs.pr }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          REPO: ${{ github.repository }}
        run: |
          description=.refine/pull-request.md
          if [[ -n "$PR" ]]; then
            [[ -f "$description" ]] && gh pr edit "$PR" --repo "$REPO" --body "$(tail -n +2 "$description")"
            exit 0
          fi
          if [[ -z "$BRANCH" ]] || ! git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null; then
            echo "Nothing was pushed, so there is no spec pull request to open. The comment on the issue says why."
            exit 0
          fi
          if [[ -f "$description" ]]; then
            title="$(head -n1 "$description")"; body="$(tail -n +2 "$description")"
          else
            title="Refine #${ISSUE}: $(gh issue view "$ISSUE" --repo "$REPO" --json title --jq .title)"
            body="Refines #${ISSUE}. Merging this approves the change for delivery; it does not close the issue."
          fi
          url="$(gh pr create --repo "$REPO" --base main --head "$BRANCH" --title "$title" --body "$body")"
          gh workflow run build.yml --repo "$REPO" --ref "$BRANCH"
          gh issue comment "$ISSUE" --repo "$REPO" \
            --body "Spec pull request for this issue: ${url}. Answer the questions there, in a comment that mentions @claude."
