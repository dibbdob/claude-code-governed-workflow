# The check main's branch protection requires before a pull request can merge: the whole gate, ./build.sh,
# run on GitHub rather than on whoever's laptop.
name: build

on:
  pull_request:
  push:
    branches: [main]
  # The refine workflow starts it on a spec pull request's branch, which it opens with a token whose events
  # start no workflows.
  workflow_dispatch:

permissions:
  contents: read

env:
  # OpenSpec's usage reporting stays off in CI (ADR 0006).
  OPENSPEC_TELEMETRY: '0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The spec check compares changes with the team's main, so it needs main's history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # actionlint checks the workflows, which build.sh runs when it is installed. The release is pinned by
      # its checksum, so what runs here changes only through a pull request.
      - name: Install actionlint
        run: |
          version=1.7.12
          sum=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          file="actionlint_${version}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$file" "https://github.com/rhysd/actionlint/releases/download/v${version}/${file}"
          echo "${sum}  $RUNNER_TEMP/$file" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: ./build.sh

