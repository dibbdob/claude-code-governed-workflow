# The check main's branch protection requires before a pull request can merge: the whole gate, ./build.sh,
# run on GitHub rather than on whoever's laptop.
name: build

on:
  pull_request:
  push:
    branches: [main]
  # To run it by hand on any branch, from the Actions tab or with gh workflow run build --ref <branch>.
  workflow_dispatch:

permissions:
  contents: read

env:
  # OpenSpec's usage reporting stays off in CI (ADR 0006).
  OPENSPEC_TELEMETRY: '0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The build reads the tree it is given, not its history, so a shallow checkout is enough.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # actionlint checks the workflows, which build.sh runs; pinned by its checksum.
      - uses: ./.github/actions/install-actionlint
      - run: ./build.sh

